"$schema" = 'https://starship.rs/config-schema.json'
 
format = """
$os\
$username\
$hostname\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$fill\
$nodejs\
$ruby\
$python\
$docker_context\
$c\
$deno\
$dotnet\
$golang\
$php\
$rust\
$swift\
$terraform\
$zig\
$conda\
$memory_usage\
$gcloud\
$azure\
$direnv\
$env_var\
$custom\
$sudo\
$jobs\
$battery\
$line_break\
$directory\
$status\
$character"""

right_format = "$cmd_duration$time"

palette = 'z'

command_timeout = 1000

[cmd_duration]
format = "[󱎫 $duration]($style)"
style = 'gold'

[container]
disabled = true

[directory]
read_only = " 󰌾"
truncate_to_repo = false
truncation_symbol = '…/'
style = 'blue'
repo_root_style = 'green'

[fill]
symbol = ' '
style = 'dimmed black'
disabled = false

[docker_context]
symbol = " "
format = " [$symbol$context]($style)"
disabled = true

[dotnet]
symbol = " "
format = " [$symbol$version]($style)"

[gcloud]
symbol = "󱇶 "
format = ' [$symbol($project)(\($region\))]($style)'
disabled = false

[username]
style_user = 'gold'
format = '[$user]($style)@'

[git_branch]
style = 'bold green'
symbol = ""
always_show_remote = true
format = '[$symbol $branch]($style)[(  $remote_name/$remote_branch) ](darkred)'

[git_commit]
style = 'bold darkgreen'
only_detached = false
format = '[󰜘$hash$tag]($style) '

[git_status]
disabled = false
format = '[$all_status$ahead_behind]($style)'
conflicted = "[$count](bold yellow) "
diverged = "[$ahead_count](cyan)[󰯎](pink)[$behind_count](pink) "
staged = '[$count󰝒](bold green) '
modified = '[$count](yellow) '
renamed = '[$count](gold) '
untracked = '[$count](orange) '
deleted = '[$count](red) '
stashed = '[$count](purple) '
ahead = "[$count⇡](cyan) "
behind = "[$count⇣](bold red) "

[c]
symbol = " "

[golang]
symbol = " "

[hostname]
ssh_symbol = ""
format = '$hostname $ssh_symbol '

[memory_usage]
symbol = "󰍛 "

[nodejs]
symbol = " "
format = " [$symbol$version]($style)"

[deno]
symbol = " "
format = " [$symbol$version]($style)"
style = "cyan"

[os]
disabled = false
format = '$symbol'
[os.symbols]
Alpine = " "
Amazon = " "
Android = " "
Arch = " "
CentOS = " "
Debian = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Kali = " "
Linux = " "
Macos = " "
Manjaro = " "
Mint = " "
openSUSE = " "
Raspbian = " "
Redhat = " "
SUSE = " "
Ubuntu = " "
Unknown = " "
Void = " "
Windows = "󰍲 "

[package]
symbol = "󰏗 "

[php]
symbol = " "

[python]
symbol = " "
format = '[$symbol$version( \($virtualenv\))]($style)'
style = "yellow"

[ruby]
symbol = " "
format = " [$symbol$version]($style)"

[rust]
symbol = " "
format = " [$symbol$version]($style)"
style = "purple"


[swift]
symbol = " "

[zig]
symbol = " "

[terraform]
symbol = "󱁢 "
format = " [$symbol$version]($style)"

[time]
format = "[ $time]($style)"
time_format = "%_I:%M:%S%P"
disabled = false
style = 'gray'

[palettes.z]
black = '#282828'
red  = '#cc241d'
darkred  = '#8c041d'
green = '#00AA30'
gold = '#dfad00'
purple = '#9400b6'
cyan = '#00B2B1'
darkgreen = '#006A20'
orange = '#DA7756'
yellow = '#d7d72b'
pink = '#e85587'
gray = '#738888'

# The statusline carries two more things than this profile renders: vim mode and
# reasoning effort, neither of which starship has a module for. ~/.claude/
# statusline.sh pulls those from the payload and prepends them, so they appear
# left of everything below. Its colour escapes are copies of [palettes.z] above
# -- change a colour there and it needs the same edit.
[profiles]
claude-code = "$directory$git_branch$git_status | $claude_model$claude_context$claude_cost"

[claude_model]
symbol = '  '
style = "bold orange"

[claude_cost]
# Default is "[$symbol(\\$$cost)]($style) " -- the escaped \$ is a literal
# dollar sign in front of $cost, which already renders as a bare 2dp number.
symbol = ''


[claude_context]
# Default is "[$gauge $percentage]($style) ". Dropping $gauge drops the
# consumption bar; $percentage carries its own % sign. gauge_width and the
# gauge_*_symbol settings become inert once $gauge is gone.
format = "[$percentage]($style) "

# Both claude modules ship a hidden bottom tier (context <30%, cost <$1), so a
# fresh session shows neither. `display` is an array, which starship replaces
# wholesale rather than merging, so tier 0 has to be restated to unhide it.
[[claude_context.display]]
threshold = 0
style = 'green'

[[claude_context.display]]
threshold = 60
style = 'gold'

[[claude_context.display]]
threshold = 80
style = 'bold red'

[[claude_cost.display]]
threshold = 0
style = 'gray'

[[claude_cost.display]]
threshold = 1
style = 'gold'

[[claude_cost.display]]
threshold = 5
style = 'bold red'
