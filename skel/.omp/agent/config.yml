modelRoles:
  default: anthropic/claude-opus-5-5
  smol: anthropic/claude-sonnet-5-5
  slow: anthropic/claude-fable-5:high
  tiny: anthropic/claude-haiku-4-5
  task: anthropic/claude-sonnet-5-5
symbolPreset: nerd
composer:
  shape: rule
theme:
  dark: titanium
  light: light
setupVersion: 2
defaultThinkingLevel: auto
display:
  shimmer: classic
  cacheMissMarker: true
tui:
  tight: false
  resizeScrollback: rebuild
  vimMode: true
  vimModeDisplay: icon
terminal:
  showProgress: true
task:
  showResolvedModelBadge: true
  enableEffort: true
  maxEffort: high
  isolation:
    enabled: true
statusLine:
  preset: nerd
  separator: powerline-thin
  transparent: true
personality: pragmatic
spelling:
  typoDetection: false
  autocomplete: "off"
  autocorrect: false
stt:
  enabled: false
startup:
  quiet: true
power:
  sleepPrevention: idle
features:
  unexpectedStopDetection: smart
extendedContext: false
memory:
  backend: local
astGrep:
  enabled: true
github:
  enabled: true
secrets:
  enabled: true
dev:
  autoqaConsent: granted
isolation:
  backend: auto
contextPromotion:
  enabled: true
autolearn:
  enabled: true
bashInterceptor:
  enabled: true
commands:
  enableClaudeUser: true
providers:
  kimiApiFormat: auto
cycleOrder:
  - smol
  - default
  - slow
  - advisor
hideThinkingBlock: false
proseOnlyThinking: false
retry:
  usageAwareFallback: true
steeringMode: one-at-a-time
interruptMode: immediate
error:
  notify: "on"
tools:
  approvalMode: yolo
autoResume: false
compaction:
  experimentalContextManagement: true
edit:
  mode: hashline
modelPresets:
  claude:
    modelRoles:
      task: anthropic/claude-sonnet-5-5
      default: anthropic/claude-opus-5-5
      smol: anthropic/claude-sonnet-5-5
      slow: anthropic/claude-fable-5:high
      tiny: anthropic/claude-haiku-4-5
    defaultThinkingLevel: auto
  kimi:
    modelRoles:
      default: kimi-code/kimi-for-coding
      smol: kimi-code/kimi-k2.5
      slow: kimi-code/k3:high
      tiny: kimi-code/kimi-k2
    defaultThinkingLevel: auto