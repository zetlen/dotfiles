providers:
  openrouter:
    modelOverrides:
      # OpenRouter's auto routers read their settings from the auto-router
      # plugin in the request body. omp sends extraBody only on the Chat
      # Completions API, so this model must not use the Responses API.
      # cost_tier low makes Auto Code weigh estimated cost first.
      # openrouter/auto has no override and runs its default tier.
      openrouter/auto-code:
        api: openai-completions
        compat:
          extraBody:
            plugins:
              - id: auto-router
                cost_tier: low
