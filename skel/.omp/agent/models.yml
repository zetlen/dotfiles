providers:
  openrouter:
    modelOverrides:
      # OpenRouter's auto router reads its settings from the auto-router
      # plugin in the request body. omp sends extraBody only on the Chat
      # Completions API, so this model must not use the Responses API.
      # cost_tier low makes the router weigh estimated cost first.
      openrouter/auto:
        api: openai-completions
        compat:
          extraBody:
            plugins:
              - id: auto-router
                cost_tier: low
