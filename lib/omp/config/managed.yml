symbolPreset: nerd
composer:
  shape: rule
theme:
  dark: titanium
  light: light
defaultThinkingLevel: auto
display:
  shimmer: classic
  cacheMissMarker: true
tui:
  tight: false
  resizeScrollback: rebuild
  vimMode: true
  vimModeDisplay: icon
terminal:
  showProgress: true
task:
  showResolvedModelBadge: true
  enableEffort: true
  maxEffort: high
  isolation:
    enabled: true
statusLine:
  preset: nerd
  separator: powerline-thin
  transparent: true
personality: pragmatic
spelling:
  typoDetection: false
  autocomplete: "off"
  autocorrect: false
stt:
  enabled: false
startup:
  quiet: true
power:
  sleepPrevention: idle
features:
  unexpectedStopDetection: smart
extendedContext: false
advisor:
  reviewMode: agent-end
memory:
  backend: local
astGrep:
  enabled: true
github:
  enabled: true
secrets:
  enabled: true
dev:
  autoqaConsent: granted
isolation:
  backend: auto
contextPromotion:
  enabled: true
autolearn:
  enabled: true
bashInterceptor:
  enabled: true
# Load ~/.claude (skills, commands) without the heavy MCP servers Claude Code
# carries there. Do not add claude-plugins to disabledProviders: omp's own
# marketplace plugins load through that provider too.
enabledProviders:
  - claude
disabledExtensions:
  - mcp:chrome-devtools
  - mcp:context7:context7
  - mcp:allsvgicons:allsvgicons
providers:
  kimiApiFormat: auto
cycleOrder:
  - default
  - slow
  - advisor
  - smol
hideThinkingBlock: false
proseOnlyThinking: false
retry:
  usageAwareFallback: true
  fallbackChains:
    default:
      - opencode-zen/big-pickle
    kimi-code/kimi-for-coding:
      - anthropic/claude-opus-5-5
    kimi-code/kimi-for-coding-highspeed:
      - anthropic/claude-sonnet-5-5
    kimi-code/k3:
      - anthropic/claude-fable-5
    kimi-code/kimi-k2-turbo-preview:
      - anthropic/claude-haiku-4-5
steeringMode: one-at-a-time
interruptMode: immediate
error:
  notify: "on"
tools:
  approvalMode: yolo
autoResume: false
compaction:
  experimentalContextManagement: true
edit:
  mode: hashline
modelPresets:
  claude:
    modelRoles:
      task: anthropic/claude-sonnet-5-5
      default: anthropic/claude-opus-5-5
      smol: anthropic/claude-sonnet-5-5
      slow: anthropic/claude-fable-5:high
      tiny: anthropic/claude-haiku-4-5
    defaultThinkingLevel: auto
  kimi:
    modelRoles:
      default: kimi-code/kimi-for-coding
      smol: kimi-code/kimi-k2.5
      slow: kimi-code/k3:high
      tiny: kimi-code/kimi-k2
    defaultThinkingLevel: auto
  openrouter-auto:
    modelRoles:
      default: openrouter/auto
      judge: opencode-zen/jev-1.13-free
      image: openrouter/meta/muse-image
    defaultThinkingLevel: auto
  claude-kimi:
    modelRoles:
      default: anthropic/claude-opus-5-5
      task: anthropic/claude-sonnet-5-5
      smol: anthropic/claude-sonnet-5-5
      tiny: anthropic/claude-haiku-4-5
      slow: kimi-code/k3:high
      advisor: anthropic/claude-fable-5:high
    defaultThinkingLevel: auto
  kimi-claude:
    modelRoles:
      default: kimi-code/kimi-for-coding
      task: kimi-code/kimi-for-coding-highspeed
      smol: kimi-code/kimi-for-coding-highspeed
      tiny: kimi-code/kimi-k2-turbo-preview
      slow: kimi-code/k3:high
      advisor: anthropic/claude-fable-5:high
    defaultThinkingLevel: auto
