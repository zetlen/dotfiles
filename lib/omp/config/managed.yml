symbolPreset: nerd
composer:
  shape: rule
theme:
  dark: titanium
  light: light
defaultThinkingLevel: auto
display:
  shimmer: classic
  cacheMissMarker: true
tui:
  tight: false
  resizeScrollback: rebuild
  vimMode: true
  vimModeDisplay: icon
terminal:
  showProgress: true
task:
  showResolvedModelBadge: true
  enableEffort: true
  maxEffort: high
  isolation:
    enabled: true
statusLine:
  preset: nerd
  separator: powerline-thin
  transparent: true
personality: pragmatic
spelling:
  typoDetection: false
  autocomplete: "off"
  autocorrect: false
stt:
  enabled: false
startup:
  quiet: true
power:
  sleepPrevention: idle
features:
  unexpectedStopDetection: smart
extendedContext: false
advisor:
  reviewMode: agent-end
memory:
  backend: local
astGrep:
  enabled: true
github:
  enabled: true
secrets:
  enabled: true
dev:
  autoqaConsent: granted
isolation:
  backend: auto
contextPromotion:
  enabled: true
autolearn:
  enabled: true
bashInterceptor:
  enabled: true
# Load ~/.claude (skills, commands) without the heavy MCP servers Claude Code
# carries there. Do not add claude-plugins to disabledProviders: omp's own
# marketplace plugins load through that provider too.
enabledProviders:
  - claude
disabledExtensions:
  - mcp:chrome-devtools
  - mcp:context7:context7
  - mcp:allsvgicons:allsvgicons
providers:
  kimiApiFormat: auto
cycleOrder:
  - default
  - slow
  - advisor
  - smol
hideThinkingBlock: false
proseOnlyThinking: false
retry:
  usageAwareFallback: true
  # Fallbacks stay on subscriptions or free models. omp switches models
  # without asking once a quota is exhausted, so a pay-per-token entry here
  # spends money silently.
  fallbackChains:
    default:
      - opencode-zen/big-pickle
    kimi-code/k3.1-pro:
      - anthropic/claude-opus-5-5
    kimi-code/kimi-for-coding:
      - anthropic/claude-sonnet-5-5
steeringMode: one-at-a-time
interruptMode: immediate
error:
  notify: "on"
tools:
  approvalMode: yolo
autoResume: false
compaction:
  experimentalContextManagement: true
edit:
  mode: hashline
modelPresets:
  claude:
    modelRoles:
      default: anthropic/claude-opus-5-5
      task: anthropic/claude-sonnet-5-5
      smol: anthropic/claude-sonnet-5-5
      slow: anthropic/claude-fable-5-2:high
      tiny: anthropic/claude-haiku-5-5
      judge: opencode-zen/jev-1.13-free
    defaultThinkingLevel: auto
  kimi:
    modelRoles:
      default: kimi-code/k3.1-pro
      smol: kimi-code/kimi-for-coding
      slow: kimi-code/k3.1-pro:high
      tiny: kimi-code/kimi-for-coding
      judge: opencode-zen/jev-1.13-free
      task: kimi-code/kimi-for-coding
    defaultThinkingLevel: auto
  openrouter-auto:
    modelRoles:
      default: openrouter/openrouter/auto-code
      slow: openrouter/openrouter/auto:high
      smol: openrouter/~deepseek/deepseek-flash-latest
      task: openrouter/~deepseek/deepseek-flash-latest
      tiny: openrouter/~z-ai/glm-flash-latest
      judge: opencode-zen/jev-1.13-free
      image: openrouter/meta/muse-image
    defaultThinkingLevel: auto
  claude-kimi:
    modelRoles:
      default: anthropic/claude-opus-5-5
      task: anthropic/claude-sonnet-5-5
      smol: anthropic/claude-sonnet-5-5
      tiny: anthropic/claude-haiku-5-5
      slow: kimi-code/k3.1-pro:high
      advisor: anthropic/claude-fable-5-2:high
      judge: opencode-zen/jev-1.13-free
    defaultThinkingLevel: auto
  kimi-claude:
    modelRoles:
      default: kimi-code/k3.1-pro
      task: kimi-code/kimi-for-coding
      smol: kimi-code/kimi-for-coding
      tiny: kimi-code/kimi-for-coding
      slow: kimi-code/k3.1-pro:high
      advisor: anthropic/claude-fable-5-2:high
      judge: opencode-zen/jev-1.13-free
    defaultThinkingLevel: auto
  gemini:
    modelRoles:
      default: openrouter/~google/gemini-pro-latest
      task: openrouter/~google/gemini-flash-latest
      smol: openrouter/~google/gemini-flash-latest
      tiny: openrouter/google/gemini-3.5-flash-lite
      slow: openrouter/~google/gemini-pro-latest:high
      judge: opencode-zen/jev-1.13-free
    defaultThinkingLevel: auto
  gemini-claude:
    modelRoles:
      default: openrouter/~google/gemini-pro-latest
      task: openrouter/~google/gemini-flash-latest
      smol: openrouter/~google/gemini-flash-latest
      tiny: openrouter/google/gemini-3.5-flash-lite
      slow: openrouter/~google/gemini-pro-latest:high
      advisor: anthropic/claude-fable-5-2:high
      judge: opencode-zen/jev-1.13-free
    defaultThinkingLevel: auto
  gpt:
    modelRoles:
      default: openai-codex/gpt-6.2-sol
      task: openai-codex/gpt-6.1-terra
      smol: openai-codex/gpt-6-luna:auto
      slow: openai-codex/gpt-6.2-astra:high
      judge: opencode-zen/jev-1.13-free
    defaultThinkingLevel: auto
  muse:
    modelRoles:
      default: openrouter/meta/muse-spark-1.3
      task: openrouter/meta/muse-ember
      smol: openrouter/meta/muse-ember
      tiny: openrouter/meta/muse-ember
      slow: openrouter/meta/muse-wonder:high
      judge: opencode-zen/jev-1.13-free
    defaultThinkingLevel: auto
  glm:
    modelRoles:
      default: openrouter/~z-ai/glm-latest
      task: openrouter/~z-ai/glm-flash-latest
      smol: openrouter/~z-ai/glm-flash-latest
      tiny: openrouter/~z-ai/glm-flash-latest
      vision: openrouter/~z-ai/glm-flash-latest
      slow: openrouter/~z-ai/glm-latest:high
      judge: opencode-zen/jev-1.13-free
    defaultThinkingLevel: auto
